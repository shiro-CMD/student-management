# Only the API Gateway is exposed outside the cluster
apiVersion: v1
kind: Service
metadata:
  name: student-gateway-service
spec:
  type: NodePort
  selector:
    app: pod1
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
# Internal service so the gateway (Pod 1) can reach Pod 2
apiVersion: v1
kind: Service
metadata:
  name: search-service
spec:
  type: ClusterIP
  selector:
    app: pod2
  ports:
    - port: 5002
      targetPort: 5002
